name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test CLI help
        run: python -m fyer_ai_visibility_feed.cli --help

      - name: Test CLI version
        run: python -m fyer_ai_visibility_feed.cli version

      - name: Run tests
        run: pytest -q

      - name: Build governed feed
        run: |
          python -m fyer_ai_visibility_feed.cli build-seed \
            --seed data/manual-seed.json \
            --registry data/sources.json \
            --output-dir outputs \
            --source-commit "${GITHUB_SHA}"

      - name: Verify feed outputs
        run: |
          test -s outputs/feed.csv
          test -s outputs/feed.json
          test -s outputs/manifest.json
          test -s outputs/SHA256SUMS
          cd outputs
          sha256sum --check SHA256SUMS

      - name: Generate build provenance attestations
        if: github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: |
            outputs/feed.csv
            outputs/feed.json
            outputs/manifest.json
            outputs/SHA256SUMS

      - name: Upload governed feed artifact
        uses: actions/upload-artifact@v7
        with:
          name: fyer-ai-visibility-feed
          path: |
            outputs/feed.csv
            outputs/feed.json
            outputs/manifest.json
            outputs/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
