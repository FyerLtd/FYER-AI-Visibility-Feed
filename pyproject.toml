[project]
name = "fyer-ai-visibility-feed"
version = "0.1.0"
description = "Build governed AI-service domain lists from operator-defined sources for Shadow AI discovery, governance review, and security-tool integration."
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [
  { name = "FYER Ltd" },
]
keywords = [
  "ai-governance",
  "shadow-ai",
  "cybersecurity",
  "domain-intelligence",
  "responsible-ai",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://fyer.co.uk"
Repository = "https://github.com/FyerLtd/FYER-AI-Visibility-Feed"
Issues = "https://github.com/FyerLtd/FYER-AI-Visibility-Feed/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
